services:
  postgres-primary:
    image: citusdata/citus:12.1
    restart: unless-stopped
    environment:
      POSTGRES_DB: guessx_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d guessx_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  backend:
    image: ghcr.io/yasterlij/guessx/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-secret}@postgres-primary:5432/guessx_db
      REDIS_URL: redis://redis:6379
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BID_ENCRYPTION_KEY: ${BID_ENCRYPTION_KEY}
      AWASH_MERCHANT_ID: ${AWASH_MERCHANT_ID}
      AWASH_SECRET_KEY: ${AWASH_SECRET_KEY}
      AWASH_WEBHOOK_SECRET: ${AWASH_WEBHOOK_SECRET}
      AWASH_BASE_URL: ${AWASH_BASE_URL:-https://sandbox.awashbank.com}
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL:-http://localhost:3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "3000:3000"
      - "3001:3000"
      - "3002:3000"
      - "3003:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks:
      - backend
      - frontend

  web:
    image: ghcr.io/yasterlij/guessx/guessx-web:latest
    build:
      context: .
      dockerfile: guessx-web/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - frontend

  migrate:
    image: node:20-alpine
    restart: "no"
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-secret}@postgres-primary:5432/guessx_db
    volumes:
      - ./scripts:/app/scripts
      - ./database:/app/database
    networks:
      - backend
    command: >
      sh -c "apk add --no-cache postgresql-client &&
             sh /app/scripts/migrate-raw.sh"

  seed:
    image: node:20-alpine
    restart: "no"
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-secret}@postgres-primary:5432/guessx_db
      DB_DIRECT: "1"
    volumes:
      - ./scripts:/app/scripts
    networks:
      - backend
    command: >
      sh -c "test -f /app/scripts/seed.js &&
             apk add --no-cache postgresql-client &&
             node /app/scripts/seed.js"

volumes:
  postgres_data:

networks:
  backend:
  frontend:
