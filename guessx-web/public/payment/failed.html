<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Failed – Guess X</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #fef2f2;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 22px; font-weight: 800;
      color: #1e3a5f; letter-spacing: -0.3px;
    }
    p { margin-top: 8px; font-size: 14px; color: #64748b; max-width: 260px; line-height: 1.5; }
    .note { margin-top: 20px; font-size: 12px; color: #94a3b8; }
    .bar {
      margin-top: 28px;
      width: 180px; height: 4px;
      border-radius: 99px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .fill {
      height: 100%; width: 0%;
      background: #ef4444;
      border-radius: 99px;
      animation: fill 1.4s ease forwards;
    }
    @keyframes fill { to { width: 100%; } }
  </style>
</head>
<body>
  <div class="circle">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </div>
  <h1>Payment Not Completed</h1>
  <p>Your payment was not completed. Returning you to the app to try again&hellip;</p>
  <div class="bar"><div class="fill"></div></div>
  <p class="note">This window will close automatically.</p>

  <script>
    var origin = window.location.origin;

    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage({ type: 'SIKINA_PAYMENT_RESULT', result: 'failed' }, origin);
        window.opener.focus();
      } catch (_) {}
    }

    try {
      var bc = new BroadcastChannel('sikina_payment');
      bc.postMessage({ result: 'failed' });
      bc.close();
    } catch (_) {}

    try {
      localStorage.setItem('sikina_payment_result', JSON.stringify({ result: 'failed', ts: Date.now() }));
    } catch (_) {}

    setTimeout(function () { window.close(); }, 1600);
  </script>
</body>
</html>
