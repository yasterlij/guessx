<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Complete – Guess X</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .circle {
      position: relative;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #10b981;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 8px 24px rgba(16,185,129,0.35);
    }
    .ping {
      position: absolute; inset: 0;
      border-radius: 50%;
      background: rgba(52,211,153,0.4);
      animation: ping 1.4s cubic-bezier(0,0,0.2,1) infinite;
    }
    @keyframes ping {
      0%   { transform: scale(1); opacity: 0.75; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    svg { position: relative; }
    h1 {
      font-size: 22px; font-weight: 800;
      color: #1e3a5f; letter-spacing: -0.3px;
    }
    p { margin-top: 8px; font-size: 14px; color: #64748b; max-width: 260px; line-height: 1.5; }
    .note { margin-top: 20px; font-size: 12px; color: #94a3b8; }
    .bar {
      margin-top: 28px;
      width: 180px; height: 4px;
      border-radius: 99px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .fill {
      height: 100%; width: 0%;
      background: #10b981;
      border-radius: 99px;
      animation: fill 1.4s ease forwards;
    }
    @keyframes fill { to { width: 100%; } }
  </style>
</head>
<body>
  <div class="circle">
    <span class="ping"></span>
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </div>
  <h1>Payment Successful!</h1>
  <p>Your payment was received. Returning you to the app&hellip;</p>
  <div class="bar"><div class="fill"></div></div>
  <p class="note">This window will close automatically.</p>

  <script>
    var origin = window.location.origin;

    // 1. Notify the opener (main app tab holds the window reference)
    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage({ type: 'SIKINA_PAYMENT_RESULT', result: 'success' }, origin);
        window.opener.focus();
      } catch (_) {}
    }

    // 2. Broadcast for same-origin tabs as a fallback
    try {
      var bc = new BroadcastChannel('sikina_payment');
      bc.postMessage({ result: 'success' });
      bc.close();
    } catch (_) {}

    // 3. Write to localStorage as an extra fallback
    try {
      localStorage.setItem('sikina_payment_result', JSON.stringify({ result: 'success', ts: Date.now() }));
    } catch (_) {}

    // 4. Close this popup after the animation
    setTimeout(function () { window.close(); }, 1600);
  </script>
</body>
</html>
