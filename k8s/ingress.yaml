apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: takelow-ingress
  labels:
    app: takelow
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  tls:
    - hosts:
        - takelow.com
        - api.takelow.com
      secretName: takelow-tls
  rules:
    - host: takelow.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: takelow-web
                port:
                  number: 80
    - host: api.takelow.com
      http:
        paths:
          - path: /api/v1/health
            pathType: Prefix
            backend:
              service:
                name: identity-service
                port:
                  number: 3001
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: identity-service
                port:
                  number: 3001
          - path: /api/v1/wallet
            pathType: Prefix
            backend:
              service:
                name: identity-service
                port:
                  number: 3001
          - path: /api/v1/auctions
            pathType: Prefix
            backend:
              service:
                name: auction-engine
                port:
                  number: 3002
          - path: /api/v1/query
            pathType: Prefix
            backend:
              service:
                name: query-service
                port:
                  number: 3003
