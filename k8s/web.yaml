apiVersion: v1
kind: Service
metadata:
  name: takelow-web
  labels:
    app: takelow
    service: takelow-web
spec:
  selector:
    app: takelow
    service: takelow-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takelow-web
  labels:
    app: takelow
    service: takelow-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: takelow
      service: takelow-web
  template:
    metadata:
      labels:
        app: takelow
        service: takelow-web
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: takelow-web
          image: ghcr.io/takelow/takelow-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_BASE_URL
              value: https://api.takelow.com/api/v1
            - name: VITE_WS_URL
              value: wss://api.takelow.com
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
