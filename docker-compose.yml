services:
  postgres-primary:
    image: citusdata/citus:12.1
    restart: unless-stopped
    environment:
      POSTGRES_DB: guessx_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d guessx_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-secret}@postgres-primary:5432/guessx_db
      REDIS_URL: redis://redis:6379
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-guessx-jwt-secret-replace-in-prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-guessx-refresh-secret-replace-in-prod}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-guessx-internal-api-key}
      AWASH_MERCHANT_ID: ${AWASH_MERCHANT_ID:-}
      AWASH_SECRET_KEY: ${AWASH_SECRET_KEY:-}
      AWASH_WEBHOOK_SECRET: ${AWASH_WEBHOOK_SECRET:-}
      AWASH_BASE_URL: ${AWASH_BASE_URL:-https://sandbox.awashbank.com}
      BID_ENCRYPTION_KEY: ${BID_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      UPLOAD_BASE_URL: http://localhost:3000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
    ports:
      - "3000:3000"
      - "3001:3000"
      - "3002:3000"
      - "3003:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
      - frontend

  web:
    build:
      context: .
      dockerfile: guessx-web/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend

  seed:
    image: node:20-alpine
    restart: "no"
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:secret@postgres-primary:5432/guessx_db
    volumes:
      - ./scripts:/app/scripts
    networks:
      - backend
    command: >
      sh -c "test -f /app/scripts/seed.js &&
             apk add --no-cache postgresql-client &&
             mkdir -p /app/backend &&
             cd /app/backend &&
             (test -f package.json || npm init -y >/dev/null 2>&1) &&
             npm install bcryptjs --no-audit --no-fund &&
             node /app/scripts/seed.js"

volumes:
  postgres_data:

networks:
  backend:
  frontend:
